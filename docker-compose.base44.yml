services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dfqlabs
      POSTGRES_PASSWORD: dfqlabs_dev
      POSTGRES_DB: dfqlabs
    volumes:
      - dfqlabs_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dfqlabs -d dfqlabs"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web:
    image: node:22-slim
    working_dir: /app
    environment:
      - NODE_ENV=development
      - PORT=5000
      - DATABASE_URL=postgresql://dfqlabs:dfqlabs_dev@db:5432/dfqlabs
      - GEMINI_MODEL=gemini-3.1-flash-lite
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX}
    env_file:
      - /run/base44/app.env
    volumes:
      - ./:/app
      - dfqlabs_node_modules:/app/node_modules
    ports:
      - "3000:5000"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npm install && npx tsx server.ts"
    restart: unless-stopped

volumes:
  dfqlabs_pgdata:
  dfqlabs_node_modules:
