name: Sync OS1 dependency lockfile

on:
  push:
    branches: [feat/agent-review-queue-os1]

permissions:
  contents: write

jobs:
  sync-lockfile:
    if: ${{ contains(github.event.head_commit.message, '[sync-lock]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate package lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile update
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: sync OS1 dependency lockfile"
          git push origin HEAD:${GITHUB_REF_NAME}
