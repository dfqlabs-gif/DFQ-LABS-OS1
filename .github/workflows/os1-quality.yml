name: OS1 quality checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "fix/os1-team-login-value-dm-workflows"]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
