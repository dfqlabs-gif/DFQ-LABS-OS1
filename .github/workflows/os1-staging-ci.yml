name: OS1 staging CI

on:
  push:
    branches:
      - feat/agent-review-queue-os1
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript checks
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Production build
        run: npm run build
